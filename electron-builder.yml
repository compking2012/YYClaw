appId: app.clawx.desktop
productName: YYClaw
copyright: Copyright © 2026 Yang Yang
compression: maximum
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!icons/*.md"
      - "!icons/*.svg"
      # 整棵 resources/bin 不随此条打进包；各平台仅在下方 mac/linux/win.extraResources 按需拷贝
      # resources/bin/<platform>-<arch>/（与当前目标 arch 一致），避免 arm64 安装包带入 darwin-x64/linux 等。
      # 须同时排除顶层「bin」链本身：仅 !bin/** 仍会拷贝 resources/bin → .app 内断链，codesign 遍历会 ENOENT。
      - "!bin"
      - "!bin/**"
      # skills-bundled 由下方独立条目拷贝；若此处包含会与第二条重复（EEXIST 等）。
      - "!skills-bundled"
      - "!skills-bundled/**"
      # build_rel 将全平台缓存放在此目录；若打进 app 会成倍放大各 arch 的 dmg/zip
      - "!build-cache/**"
      - "!screenshot/**"
  - from: resources/skills-bundled/
    to: resources/skills-bundled/
  # OpenClaw package (node_modules copied separately by afterPack hook
  # because electron-builder respects .gitignore which excludes node_modules/)
  - from: build/openclaw/
    to: openclaw/
  # Pre-bundled third-party skills (full directories, not only SKILL.md)
  - from: build/preinstalled-skills/
    to: resources/preinstalled-skills/
  # NOTE: OpenClaw plugin mirrors (dingtalk, etc.) are bundled by the
  # afterPack hook (after-pack.cjs) directly from node_modules, so they
  # don't need an extraResources entry here.

afterPack: ./scripts/after-pack.cjs

asar: true
asarUnpack:
  - "**/*.node"
  # lru-cache CJS/ESM interop: older CJS versions (v5, v6, v7) don't export
  # `LRUCache` as a named property, breaking `import { LRUCache }` in Node.js
  # 22+ (Electron 40+).  Unpacking lets afterPack patch them in place.
  - "**/node_modules/lru-cache/**"

# Disable native module rebuilding.
# The Electron renderer/main process has no native (.node) dependencies.
# All native modules (opus, sharp, koffi …) belong to openclaw, which is
# bundled separately (bundle-openclaw.mjs → extraResources) and runs in its
# own process — @electron/rebuild must NOT touch them.
npmRebuild: false

# Auto-update configuration
# Primary: Alibaba Cloud OSS (fast for Chinese users, used for auto-update)
# Fallback: GitHub Releases (backup, used when OSS is unavailable)
publish:
  - provider: generic
    url: https://claw-x.com/latest
    useMultipleRangeRequest: false

# macOS Configuration
mac:
  # 仅影响 mac 的 zip 等 ArchiveTarget；DMG 在 dmg 段用 format: UDBZ 保持与原 compression:maximum 等价的 bzip2。根 compression 仍用于 win/linux。zip blockmap 不变。
  compression: normal
  extraResources:
    - from: resources/bin/darwin-${arch}/
      to: bin/
    - from: resources/cli/posix/
      to: cli/
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: YYClaw requires microphone access for voice features
    NSCameraUsageDescription: YYClaw requires camera access for video features

dmg:
  format: UDBZ
  # Skip blockmap generation (faster build; updates will be full-download instead of differential)
  writeUpdateInfo: false
  # Explicit volume size prevents dmg-builder@1.2.0 auto-calculation from
  # underestimating (causes "No space left on device" for large app bundles).
  # The final .dmg is bzip2-compressed, so this only affects the temp volume.
  size: 2g
  background: resources/dmg-background.png
  icon: resources/icons/icon.icns
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - type: file
      x: 130
      y: 220
    - type: link
      path: /Applications
      x: 410
      y: 220

# Windows Configuration
win:
  # Skip update signature verification: we ship via OSS + GitHub without a
  # code-signing certificate, so verifying would always fail on the updater.
  verifyUpdateCodeSignature: false
  extraResources:
    - from: resources/bin/win32-${arch}/
      to: bin/
    - from: resources/cli/win32/
      to: cli/
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  warningsAsErrors: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: true
  # String "always" enables RECREATE_DESKTOP_SHORTCUT in NSIS; customInstall also forces
  # shortcut recreation after upgrade when KeepShortcuts + deleted .lnk would skip it.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: YYClaw
  uninstallDisplayName: YYClaw
  license: LICENSE
  include: scripts/installer.nsh
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico

# Linux Configuration
linux:
  extraResources:
    - from: resources/bin/linux-${arch}/
      to: bin/
    - from: resources/cli/posix/
      to: cli/
  icon: resources/icons
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: YYClaw Team
  vendor: YYClaw
  synopsis: AI Assistant powered by OpenClaw
  description: YYClaw is a graphical AI assistant application that integrates with OpenClaw Gateway to provide intelligent automation and assistance across multiple messaging platforms.
  desktop:
    entry:
      Name: YYClaw
      Comment: AI Assistant powered by OpenClaw
      Categories: Utility;Network;
      Keywords: ai;assistant;automation;chat;
      StartupWMClass: yyclaw

appImage:
  license: LICENSE

deb:
  depends:
    # Use OR syntax to support both Ubuntu 22.04 and Ubuntu 24.04 (t64 transition).
    # Ubuntu 24.04 renamed many libraries with a t64 suffix (64-bit time_t ABI transition).
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4 | libnotify4t64
    - libnss3
    - libxss1 | libxss1t64
    - libxtst6 | libxtst6t64
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
  afterInstall: scripts/linux/after-install.sh
  afterRemove: scripts/linux/after-remove.sh
