packages:
  - '.'

# Skip LangGraph optional roots by default; Rollup/esbuild platform binaries still install.
# When langgraph.env enables LangGraph, scripts/run-init.mjs installs these explicitly.
ignoredOptionalDependencies:
  - '@langchain/langgraph'
  - p-finally

ignoredBuiltDependencies:
  - electron
  - esbuild

patchedDependencies:
  openclaw@2026.7.1-2: patches/openclaw@2026.7.1-2.patch
